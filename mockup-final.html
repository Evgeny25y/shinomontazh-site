<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лендинг «Шиномонтаж»</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: linear-gradient(135deg, #e8e5e0 0%, #f5f2ed 100%);
            min-height: 100vh;
            padding: 3rem 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .tagline {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: #c85a54;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 1rem;
            word-spacing: 4px;
        }

        .title {
            font-size: 4rem;
            font-weight: 400;
            color: #1a1a1a;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
            line-height: 1.1;
            font-family: 'Times New Roman', serif;
        }

        .divider {
            width: 80px;
            height: 3px;
            background: #c85a54;
            margin: 0 auto;
        }

        /* Devices Row */
        .devices {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 4rem;
            margin-top: 4rem;
        }

        /* Laptop */
        .laptop {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            width: 620px;
            flex: 0 0 auto;
        }

        .laptop::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 10px;
            background: #2a2a2a;
            border-radius: 0 0 18px 18px;
        }

        .laptop::after {
            content: '';
            position: absolute;
            bottom: -22px;
            left: 0;
            right: 0;
            height: 18px;
            background: #2a2a2a;
            border-radius: 0 0 35px 35px;
        }

        .laptop-screen {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            background: white;
        }

        .laptop-screen img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Phone */
        .phone {
            background: #2a2a2a;
            border-radius: 18px;
            padding: 5px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
            position: relative;
            width: 150px;
            flex: 0 0 auto;
            align-self: center;
        }

        .phone::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 13px;
            background: #2a2a2a;
            border-radius: 0 0 12px 12px;
            z-index: 10;
        }

        .phone::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 1px;
        }

        .phone-screen {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: white;
        }

        .phone-screen img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .title {
                font-size: 3rem;
            }

            .laptop {
                width: 500px;
            }

            .devices {
                gap: 2rem;
            }
        }

        @media (max-width: 1000px) {
            .devices {
                flex-direction: column;
                align-items: center;
                gap: 2rem;
            }

            .laptop {
                width: 100%;
                max-width: 550px;
            }

            .phone {
                width: 100%;
                max-width: 150px;
            }

            .title {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 600px) {
            .title {
                font-size: 1.8rem;
            }

            .tagline {
                font-size: 0.65rem;
                letter-spacing: 2px;
            }

            .laptop {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="tagline">ОДНОСТРАДНИЧНЫЙ САЙТ · АДАПТИВ ПОД ТЕЛЕФОН</div>
            <h1 class="title">Лендинг «Шиномонтаж»</h1>
            <div class="divider"></div>
        </div>

        <!-- Devices in One Row -->
        <div class="devices">
            <!-- Laptop -->
            <div class="laptop">
                <div class="laptop-screen">
                    <img src="shino-desktop.webp" alt="Лендинг Шиномонтаж - десктопная версия">
                </div>
            </div>

            <!-- Phone -->
            <div class="phone">
                <div class="phone-screen">
                    <img src="shino-mobile.webp" alt="Лендинг Шиномонтаж - мобильная версия">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
